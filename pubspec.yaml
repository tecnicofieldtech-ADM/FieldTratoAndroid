name: field_trato
description: Field Trato - Automacao de fabricacao e fornecimento
publish_to: "none"

version: 1.0.29+112

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  network_info_plus: ^6.0.1
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  wifi_iot: ^0.3.19+2
  fl_chart: ^0.66.0
  http: ^1.2.2
  flutter_lints: ^5.0.0
  package_info_plus: ^9.0.0
  flutter_bluetooth_serial: ^0.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3


flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_Filed_Transparente.png
    - assets/images/bg_boi_tech.png
    - assets/images/truck.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_Filed_Transparente.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_Filed_Transparente.png"



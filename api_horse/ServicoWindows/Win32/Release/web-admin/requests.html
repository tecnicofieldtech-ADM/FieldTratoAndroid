<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RFeed API Horse — Monitor ao vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-gradient-to-b from-slate-50 via-teal-50/30 to-slate-50 text-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8 rounded-2xl bg-slate-900 px-6 py-8 text-white sm:px-10">
      <p class="text-xs font-semibold uppercase tracking-widest text-teal-300">API Horse · Tablet</p>
      <h1 class="mt-2 text-3xl font-bold">Monitor ao vivo</h1>
      <p class="mt-2 text-sm text-slate-300">
        Chamadas recebidas nesta API (sync, POST de fornecimento, fabricação, etc.). Atualiza a cada 2 segundos.
      </p>
    </header>

    <nav class="mb-6 flex flex-wrap gap-1 rounded-xl bg-white p-1.5 shadow-sm ring-1 ring-slate-200">
      <a href="/config" data-admin-nav="config"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Configuração</a>
      <a href="/dashboard/fabricacao" data-admin-nav="dashfab"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Dashboard Fabricação</a>
      <a href="/monitor" data-admin-nav="monitor"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Monitor ao vivo</a>
      <a href="/audit/fornecimento" data-admin-nav="audit-forn"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Aud. fornecimento</a>
      <a href="/audit/fabricacao" data-admin-nav="audit-fab"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Aud. fabricação</a>
      <a href="/health" data-admin-nav="health"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition">Health</a>
    </nav>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <label class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm">
        <input type="checkbox" id="onlyErrors" />
        Apenas erros
      </label>
      <span id="countBadge" class="rounded-lg bg-white px-3 py-1.5 text-sm text-slate-600 ring-1 ring-slate-200">Carregando…</span>
      <button type="button" id="btnClear"
        class="rounded-lg border border-rose-300 bg-white px-3 py-1.5 text-sm font-medium text-rose-700 hover:bg-rose-50">
        Limpar logs
      </button>
    </div>

    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
      <div class="max-h-[72vh] overflow-auto">
        <table class="min-w-full text-left text-sm">
          <thead class="sticky top-0 bg-slate-100 text-slate-700">
            <tr>
              <th class="px-3 py-2 font-semibold">Quando</th>
              <th class="px-3 py-2 font-semibold">Método</th>
              <th class="px-3 py-2 font-semibold">Rota</th>
              <th class="px-3 py-2 font-semibold">IP</th>
              <th class="px-3 py-2 font-semibold">Status</th>
              <th class="px-3 py-2 font-semibold">ms</th>
              <th class="px-3 py-2 font-semibold">Request</th>
              <th class="px-3 py-2 font-semibold">Erro</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <p id="filePath" class="mt-3 font-mono text-xs text-slate-500"></p>
  </div>

  <script src="/web-admin/request-monitor.js"></script>
  <script>
    RFeedRequestMonitor.initNav("monitor");
    RFeedRequestMonitor.init({ prefix: "" });
  </script>
</body>
</html>
